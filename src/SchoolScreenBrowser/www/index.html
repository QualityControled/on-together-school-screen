<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <style>
    html, body, #player, #waiting { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #080a10; color: #f5f5f5; font: 20px Segoe UI, sans-serif; }
    #waiting { display: grid; place-items: center; position: absolute; inset: 0; background: #10151e; isolation: isolate; container-type: inline-size; }
    .dvd-logo { position: absolute; left: 0; top: 0; width: clamp(82px, 19%, 145px); aspect-ratio: 2.15 / 1; container-type: inline-size; color: #6de4f2; filter: drop-shadow(0 0 9px currentColor); will-change: transform; pointer-events: none; opacity: .8; z-index: 0; }
    .dvd-word { position: absolute; inset: 0 0 auto; font-family: "Arial Black", Arial, sans-serif; font-size: 48cqw; font-weight: 900; font-style: italic; line-height: 1; letter-spacing: -.095em; padding-right: .095em; text-align: center; transform: skewX(-8deg) scaleY(.65); transform-origin: 50% 0; }
    .dvd-disc { position: absolute; top: 64%; height: 6cqw; width: 100%; border-radius: 50%; background: currentColor; }
    .dvd-disc::after { content: ""; position: absolute; left: 40%; top: 33%; width: 20%; height: 34%; border-radius: 50%; background: #10151e; }
    .dvd-video { position: absolute; inset: auto 0 0; font-size: 9cqw; font-weight: 700; line-height: 1; letter-spacing: .52em; padding-left: .52em; text-align: center; }
    .waiting-message { position: relative; z-index: 2; max-width: calc(100% - 32px); box-sizing: border-box; padding: 16px 24px 18px; text-align: center; background: rgb(16 21 30 / .94); border-radius: 12px; pointer-events: none; }
    .waiting-heading { font-size: clamp(22px, 4cqw, 30px); font-weight: 600; line-height: 1.3; letter-spacing: -.02em; color: #f4f1ff; }
    .waiting-prompt { margin-top: 9px; font-size: clamp(13px, 2.4cqw, 18px); line-height: 1.6; color: #c2c8d9; white-space: nowrap; }
    .waiting-prompt kbd { display: inline-block; margin: 0 3px; padding: 0 7px; border: 1px solid #656982; border-bottom-width: 3px; border-radius: 5px; background: #2a2c43; color: #f4f1ff; font: inherit; font-weight: 600; }
    #titleLookup { position: fixed; left: -1200px; top: -1200px; width: 320px; height: 180px; opacity: 0; pointer-events: none; }
    @media (max-width: 400px) { .waiting-message { padding: 10px 15px 12px; } .waiting-prompt { margin-top: 5px; } }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="waiting">
    <div class="dvd-logo" aria-hidden="true">
      <div class="dvd-word">DVD</div>
      <div class="dvd-disc"></div>
      <div class="dvd-video">VIDEO</div>
    </div>
    <div class="waiting-message">
      <div class="waiting-heading">School screen</div>
      <div class="waiting-prompt">Press <kbd>F9</kbd> to add a video</div>
    </div>
  </div>
  <div id="titleLookup" aria-hidden="true"></div>
  <script>
    let player = null;
    let playerReady = false;
    let activeVideoId = '';
    let activeLoadId = 0;
    let titleLookupPlayer = null;
    let titleLookupReady = false;
    let activeTitleLookup = null;
    let titleLookupStartedAt = 0;
    const titleLookupQueue = [];
    const titleLookupQueued = new Set();
    const pending = [];
    const waiting = document.getElementById('waiting');
    const idleLogo = waiting.querySelector('.dvd-logo');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const idleColors = ['#6de4f2', '#af95ff', '#f5d674', '#f68c9f', '#86e4aa'];
    let waitingVisible = true;
    let idleColorIndex = 0;
    let idleX = 20;
    let idleY = 18;
    let idleDirectionX = 1;
    let idleDirectionY = 1;
    let idlePreviousTime = null;
    let idleLastRafTime = 0;
    let idleRaf = null;
    let idleWatchdog = null;

    function positionIdleLogo() {
      const maxX = Math.max(0, waiting.clientWidth - idleLogo.offsetWidth);
      const maxY = Math.max(0, waiting.clientHeight - idleLogo.offsetHeight);
      idleX = Math.max(0, Math.min(maxX, idleX));
      idleY = Math.max(0, Math.min(maxY, idleY));
      idleLogo.style.transform = `translate3d(${idleX}px, ${idleY}px, 0)`;
      return { maxX, maxY };
    }

    function advanceIdleLogo(time) {
      const delta = idlePreviousTime === null ? 0 : Math.max(0, Math.min(.05, (time - idlePreviousTime) / 1000));
      idlePreviousTime = time;
      const { maxX, maxY } = positionIdleLogo();
      const scale = waiting.clientWidth / 768;
      idleX += idleDirectionX * 72 * scale * delta;
      idleY += idleDirectionY * 72 * .64 * scale * delta;
      let bounced = false;
      if (maxX > 0 && idleX <= 0 && idleDirectionX < 0) { idleX = 0; idleDirectionX = 1; bounced = true; }
      else if (maxX > 0 && idleX >= maxX && idleDirectionX > 0) { idleX = maxX; idleDirectionX = -1; bounced = true; }
      if (maxY > 0 && idleY <= 0 && idleDirectionY < 0) { idleY = 0; idleDirectionY = 1; bounced = true; }
      else if (maxY > 0 && idleY >= maxY && idleDirectionY > 0) { idleY = maxY; idleDirectionY = -1; bounced = true; }
      if (bounced) {
        idleColorIndex = (idleColorIndex + 1) % idleColors.length;
        idleLogo.style.color = idleColors[idleColorIndex];
      }
      positionIdleLogo();
    }

    function idleFrame(time) {
      idleRaf = null;
      if (!waitingVisible || reduceMotion.matches) return;
      idleLastRafTime = time;
      advanceIdleLogo(time);
      idleRaf = requestAnimationFrame(idleFrame);
    }

    function stopIdleAnimation() {
      if (idleRaf !== null) cancelAnimationFrame(idleRaf);
      if (idleWatchdog !== null) clearInterval(idleWatchdog);
      idleRaf = null;
      idleWatchdog = null;
      idlePreviousTime = null;
    }

    function startIdleAnimation() {
      stopIdleAnimation();
      positionIdleLogo();
      if (!waitingVisible || reduceMotion.matches) return;
      idleLastRafTime = performance.now();
      idleRaf = requestAnimationFrame(idleFrame);
      // The helper is offscreen; Chromium may suspend rAF while preview capture continues.
      idleWatchdog = setInterval(() => {
        if (!waitingVisible || reduceMotion.matches) return;
        const time = performance.now();
        if (time - idleLastRafTime >= 100) advanceIdleLogo(time);
      }, 33);
    }

    function showWaitingScreen(show) {
      waitingVisible = show;
      waiting.style.display = show ? 'grid' : 'none';
      if (show) startIdleAnimation();
      else stopIdleAnimation();
    }

    const idleResizeObserver = new ResizeObserver(() => {
      if (waitingVisible) positionIdleLogo();
    });
    idleResizeObserver.observe(waiting);
    reduceMotion.addEventListener('change', () => {
      if (waitingVisible) startIdleAnimation();
    });
    window.addEventListener('pagehide', () => {
      stopIdleAnimation();
      idleResizeObserver.disconnect();
    }, { once: true });
    startIdleAnimation();

    function invokePending() {
      if (!playerReady) return;
      while (pending.length) applyCommand(pending.shift());
    }

    function applyCommand(command) {
      if (command.type === 'open') {
        activeVideoId = command.id;
        activeLoadId = command.loadId;
        showWaitingScreen(false);
        player.loadVideoById({ videoId: command.id, startSeconds: command.time });
      } else if (command.type === 'clear') {
        activeVideoId = '';
        activeLoadId = 0;
        showWaitingScreen(true);
        if (player) player.stopVideo();
      } else if (command.type === 'play') {
        player.playVideo();
      } else if (command.type === 'pause') {
        player.pauseVideo();
      } else if (command.type === 'seek') {
        player.seekTo(command.time, true);
      } else if (command.type === 'volume') {
        player.setVolume(command.volume);
      }
    }

    window.schoolScreenCommand = function (type, value, time, loadId) {
      const command = type === 'open'
        ? { type: type, id: value, time: Number(time) || 0, loadId: Number(loadId) || 0 }
        : type === 'volume'
          ? { type: type, volume: Math.max(0, Math.min(100, Number(value) || 0)) }
        : { type: type, time: Number(value) || 0 };
      if (!playerReady) pending.push(command);
      else applyCommand(command);
    };

    function startTitleLookup() {
      if (!titleLookupReady || activeTitleLookup || titleLookupQueue.length === 0) return;
      activeTitleLookup = titleLookupQueue.shift();
      titleLookupStartedAt = Date.now();
      try {
        titleLookupPlayer.cueVideoById(activeTitleLookup);
        setTimeout(checkTitleLookup, 200);
      } catch (_) {
        finishTitleLookup('');
      }
    }

    function checkTitleLookup() {
      if (!activeTitleLookup || !titleLookupPlayer) return;
      try {
        const data = titleLookupPlayer.getVideoData ? titleLookupPlayer.getVideoData() : null;
        const idMatches = data && (!data.video_id || data.video_id === activeTitleLookup);
        const title = data && data.title ? String(data.title).replace(/[|\r\n]+/g, ' ').trim() : '';
        if (title && idMatches && titleLookupPlayer.getPlayerState() === 5) {
          finishTitleLookup(title);
          return;
        }
      } catch (_) { }

      if (Date.now() - titleLookupStartedAt >= 12000) finishTitleLookup('');
      else setTimeout(checkTitleLookup, 250);
    }

    function finishTitleLookup(title) {
      const id = activeTitleLookup;
      if (!id) return;
      activeTitleLookup = null;
      if (title) window.chrome.webview.postMessage('TITLE|' + id + '|' + title.slice(0, 100));
      setTimeout(startTitleLookup, 150);
    }

    window.schoolScreenLookupTitle = function (id) {
      id = String(id || '').trim();
      if (!/^[A-Za-z0-9_-]{11}$/.test(id) || titleLookupQueued.has(id)) return;
      titleLookupQueued.add(id);
      titleLookupQueue.push(id);
      startTitleLookup();
    };

    window.schoolScreenResetTitleLookups = function () {
      titleLookupQueue.length = 0;
      titleLookupQueued.clear();
      activeTitleLookup = null;
      if (titleLookupPlayer && titleLookupPlayer.stopVideo) titleLookupPlayer.stopVideo();
    };

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        width: Math.max(200, window.innerWidth), height: Math.max(200, window.innerHeight),
        playerVars: {
          controls: 1,
          playsinline: 1,
          rel: 0,
          origin: window.location.origin
        },
        events: {
          onReady: function () { playerReady = true; invokePending(); },
          onStateChange: function () { sendState(); }
        }
      });
      titleLookupPlayer = new YT.Player('titleLookup', {
        width: 320, height: 180,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, origin: window.location.origin },
        events: {
          onReady: function (event) {
            titleLookupReady = true;
            if (event.target.mute) event.target.mute();
            startTitleLookup();
          }
        }
      });
    };

    function sendState() {
      if (!player || !player.getCurrentTime || !activeVideoId) return;
      const time = Number(player.getCurrentTime()) || 0;
      const state = Number(player.getPlayerState());
      const videoData = player.getVideoData ? player.getVideoData() : null;
      if (!videoData || videoData.video_id !== activeVideoId) return;
      const title = videoData && videoData.title ? String(videoData.title).replace(/[|\r\n]+/g, ' ').slice(0, 100) : '';
      window.chrome.webview.postMessage('STATE|' + time.toFixed(1) + '|' + state + '|' + title + '|' + activeVideoId + '|' + activeLoadId);
    }
    setInterval(sendState, 1000);

    const api = document.createElement('script');
    api.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(api);
  </script>
</body>
</html>
